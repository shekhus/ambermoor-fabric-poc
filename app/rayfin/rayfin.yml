id: ambermoor-command-center
name: Ambermoor Freshness Command Center
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
    allowedRedirectUris:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - https://clear-ford-d121a4ad77-westus3.webapp.fabricapps.net
  data:
    enabled: true
    dialect: mssql
  storage:
    enabled: false
  staticHosting:
    enabled: true
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
    assetAccess: protected
  functions:
    enabled: true
    buildCommand: npm run build
    auth:
      type: application
secrets:
  - name: ANTHROPIC_API_KEY
    description: Claude API key for the Ask tab
